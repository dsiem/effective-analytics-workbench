bundle:
  name: databricks-effect-app
  databricks_cli_version: ">= 1.26.0, < 2.0.0"

variables:
  app_name:
    description: Unique app name (lowercase letters, digits, hyphens; at most 30 characters).
    default: ${bundle.name}-${bundle.target}
  data_name:
    description: Prefix for the data resources managed by this bundle target.
    default: ${bundle.name}-${bundle.target}
  data_catalog:
    description: Unity Catalog catalog for the processed NYC taxi dataset.
    default: workspace
  data_schema:
    description: Unity Catalog schema for the processed NYC taxi dataset.
    default: ${var.data_name}
  warehouse_name:
    description: Display name of the SQL warehouse.
    default: ${var.data_name}-analytics

include:
  - resources/*.yml

sync:
  exclude:
    - /.github/
    - /scripts/
    - test/
    - README.md
    - DEPLOYMENT.md
    - /.oxlintrc.json
    - /.oxfmtrc.json
    - /playwright.config.ts

targets:
  dev:
    default: true
  prod:
    mode: production
    variables:
      app_name: ${bundle.name}
    workspace:
      root_path: /Workspace/Production/.bundle/${bundle.name}/${bundle.target}
