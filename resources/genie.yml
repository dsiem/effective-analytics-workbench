resources:
  genie_spaces:
    taxi:
      title: ${var.app_name} NYC taxi analyst
      description: NYC yellow taxi trips in the configured pickup date range.
      warehouse_id: ${resources.sql_warehouses.analytics.id}
      serialized_space: |
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "01f1df70000000000000000000000001",
                "question": [
                  "Which pickup ZIP codes have the most trips?"
                ]
              },
              {
                "id": "01f1df70000000000000000000000002",
                "question": [
                  "How does the average fare change by hour of day?"
                ]
              },
              {
                "id": "01f1df70000000000000000000000003",
                "question": [
                  "Show total trips and fare revenue by month."
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.data_catalog}.${var.data_schema}.trips"
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "01f1df70000000000000000000000004",
                "content": [
                  "Use trips for read-only analysis of accepted NYC taxi trips. Use the minimum and maximum pickup timestamps to find the available dates. Pickup and drop-off timestamps are in New York local time. Filter on pickup time and include the entire end date. Trip distance is in miles. Sum fare_amount for USD fare revenue. total_amount includes fees, tolls, and recorded tips. Cash tips are absent from the data. ZIP codes come from 2020 Census ZCTA boundaries. For a selected map area, apply the active pickup date and ZIP filters and use the selected pickup or drop-off coordinates and their validity flag. Match the area ID with h3_h3tostring(h3_longlatash3(longitude, latitude, 10)). Use the matching, located, and shown counts to describe the map's coverage."
                ]
              }
            ]
          }
        }
