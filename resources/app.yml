resources:
  apps:
    app:
      name: ${var.app_name}
      description: NYC taxi analytics, Genie, and Lakebase saved views, composed with Effect.
      source_code_path: ..
      config:
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: lakehouse
          - name: TRIP_SNAPSHOT_TABLE
            value: ${resources.schemas.data.catalog_name}.${resources.schemas.data.name}.trips
          - name: ANALYSIS_JOB_ID
            value_from: route-reliability
          - name: ANALYSIS_RESULTS_TABLE
            value: ${resources.schemas.data.catalog_name}.${resources.schemas.data.name}.route_reliability_runs
          - name: GENIE_SPACE_ID
            value_from: genie
          - name: LAKEBASE_ENDPOINT
            value_from: lakebase
          - name: PGDATABASE
            value: databricks_postgres
      resources:
        - name: lakehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.analytics.id}
            permission: CAN_USE
        - name: route-reliability
          job:
            id: ${resources.jobs.route_reliability.id}
            permission: CAN_MANAGE_RUN
        - name: genie
          genie_space:
            name: ${resources.genie_spaces.taxi.title}
            space_id: ${resources.genie_spaces.taxi.id}
            permission: CAN_RUN
        - name: lakebase
          postgres:
            branch: ${resources.postgres_branches.notebook_branch.name}
            database: ${resources.postgres_branches.notebook_branch.name}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
