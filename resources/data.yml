resources:
  schemas:
    data:
      name: ${var.data_schema}
      catalog_name: ${var.data_catalog}
      comment: Raw and enriched NYC taxi trips and route analysis results.
  volumes:
    taxi_sources:
      name: taxi_sources
      catalog_name: ${resources.schemas.data.catalog_name}
      schema_name: ${resources.schemas.data.name}
      volume_type: MANAGED
      comment: Pinned geographic boundaries for reproducible taxi enrichment.
